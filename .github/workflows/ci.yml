name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Check for em dashes
        run: |
          if grep -rnP "\x{2014}" --include="*.ts" --include="*.tsx" --include="*.md" --include="*.css" --include="*.json" .; then
            echo "Found an em dash. Use a hyphen or reword."
            exit 1
          fi
