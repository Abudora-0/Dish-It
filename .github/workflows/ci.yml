name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Check for em dashes in tracked source
        run: |
          if git ls-files -z -- '*.ts' '*.tsx' '*.css' '*.md' '*.mjs' '*.yml' '*.svg' \
            | xargs -0 grep -lnP "\x{2014}|\x{2013}"; then
            echo "Found an em or en dash in tracked source. Use a hyphen or reword."
            exit 1
          fi
